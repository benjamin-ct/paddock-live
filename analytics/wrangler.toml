# Statistiques d'utilisation anonymes de Paddock Live (déployé par le workflow « Statistiques »,
# sur le compte Cloudflare du jeton CLOUDFLARE_API_TOKEN)
name = "paddock-live-stats"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Fichiers statiques : page web du créateur (/studio/), copiée avec le code partagé et les polices
# par scripts/build-studio.mjs avant le déploiement (dossier généré, non suivi par git)
[assets]
directory = "./site"
binding = "ASSETS"
# Version web du direct : servie seulement sur app.paddocklive.app, décidé par le Worker (analytics/worker.js)
run_worker_first = ["/live", "/live/*"]

[[d1_databases]]
binding = "DB"
database_name = "paddock-live-stats"
# Rempli par le workflow (base créée au premier déploiement si elle n'existe pas)
database_id = "00000000-0000-0000-0000-000000000000"

# Vidéos des publications confiées au serveur (« Publier » ou programmées), effacées une fois publiées.
# Espace créé par le workflow s'il n'existe pas (R2 activé sur le compte Cloudflare)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "paddock-live-media"

# Le Worker lié à lui-même : chaque réseau d'une publication envoyé par un appel à part (avec ses propres
# limites), tous en même temps, au lieu d'un réseau par minute
[[services]]
binding = "SELF"
service = "paddock-live-stats"

# Workers AI : traduction des actualités et des radios (Mistral Small 3.1), transcription des radios (Whisper)
# Toutes les minutes : publications programmées de la page du créateur ; toutes les 5 minutes,
# relevé des flux d'actu pour ses alertes (rien si personne n'est abonné)
# Version web du direct (/live/) : une seule connexion au flux F1, redistribuée à tous les navigateurs
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRelay"

[[migrations]]
tag = "v1-live"
new_sqlite_classes = ["LiveRelay"]

[triggers]
crons = ["* * * * *"]

# Temps de calcul par appel (forfait Workers payant) : la tâche planifiée calcule les zones d'un circuit d'après une
# séance archivée (plusieurs secondes) ; 30 s par défaut, 2 min ici pour avoir de la marge
[limits]
cpu_ms = 120000

[ai]
binding = "AI"

[vars]
# Adresse officielle : les pages ouvertes sur *.workers.dev (connexion, statistiques, Studio) y renvoient
SITE_ORIGIN = "https://paddocklive.app"
AI_DAILY_LIMIT = "20000"
ASR_DAILY_LIMIT = "3000"

# Journaux et traces du Worker dans le tableau de bord Cloudflare (Observability) : chaque requête,
# ses console.log et ses erreurs, conservés pour retrouver l'origine d'un problème
[observability]
enabled = false
head_sampling_rate = 1
# Paramètres des adresses masqués (un ancien lien /stats?key=… contient le mot de passe)
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# Pas encore connu de wrangler 4.151 (simple avertissement au déploiement) : à activer aussi dans le
# tableau de bord Cloudflare si besoin
[observability.issue_detection]
enabled = true
