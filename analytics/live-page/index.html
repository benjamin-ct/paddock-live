  <script>/* Apparence (sombre / clair / système) et design posés avant l'affichage : pas d'éclair */ try { const p = JSON.parse(localStorage.getItem('paddock.prefs') || '{}'); const s = p.schemeSet || p.scheme === 'light' ? p.scheme : 'auto'; const light = s === 'light' || (s === 'auto' && matchMedia('(prefers-color-scheme: light)').matches); document.documentElement.dataset.scheme = light ? 'light' : 'dark'; document.documentElement.dataset.design = p.designV >= 2 ? p.design || 'v3' : p.design === 'classic' ? 'classic' : 'v3'; if (light && document.documentElement.dataset.design !== 'v2') document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = 'default'; } catch { document.documentElement.dataset.scheme = 'dark'; document.documentElement.dataset.design = 'v3'; } document.documentElement.dataset.theme = 'pitwall'; document.documentElement.classList.add('web'); const only = /[?&]only=(map|analysis|duel|compare)\b/.exec(location.search)?.[1]; if (only) document.documentElement.classList.add('only', `only-${only}`);</script>
  <style>
    /* Version web : écran principal de l'appli, sans menu latéral ni outils. Classement à gauche, circuit au centre,
       télémétrie, radios et direction de course l'une sous l'autre à droite ; Analyse et Duel dans des fenêtres à part */
    .web body { padding-left: 0 !important; }
    .web .grid { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.15fr) minmax(0, .95fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1.1fr);
      grid-template-areas: "tower map tele" "tower map radio" "tower map feed"; }
    .web .p-extra, .web .p-duel { display: none; }   /* onglets de course : rangés dans la fenêtre Analyse par web.js */
    .web .win-btn { gap: 5px; }
    /* Barre du haut sur une seule ligne sur ordinateur : écarts resserrés ; en dessous de 2400 px la météo passe dans le
       bouton « Météo » des outils, puis les boutons Analyse, Duel et Saison gardent leur icône seule, enfin les pas de 5 s
       du délai, l'heure du circuit, les tours restants, l'état de la piste et les noms des outils s'effacent */
    @media (min-width: 901px) {
      .web .topbar { column-gap: 14px; }
      .web .topbar .spacer { min-width: 0; }
    }
    @media (min-width: 901px) and (max-width: 2400px) { html.web .topbar .weather-mini { display: none !important; } }
    @media (min-width: 901px) and (max-width: 2300px) { .web .win-btn, .web .topbar #seasonBtn { padding: 6px; } .web .win-btn .wb-lbl, .web .topbar #seasonBtn .sz-lbl { display: none; } }
    @media (min-width: 901px) and (max-width: 2000px) { .web .web-delay .m:first-of-type, .web .web-delay [data-step="5000"] { display: none !important; } }
    @media (min-width: 901px) and (max-width: 1800px) { .web #circuitTimeBox { display: none !important; } }
    @media (min-width: 901px) and (max-width: 1700px) { .web #lapsLeftBox, .web #surfaceBox, .web .tb-tool small { display: none !important; } }
    /* Barre du haut trop longue pour l'écran (séance, météo, délai, boutons) : la suite passe à la ligne au lieu de sortir */
    .web .topbar { flex-wrap: wrap; row-gap: 6px; }
    .web .p-radio { grid-area: radio; }
    .web .p-analysis { grid-area: tele; }
    /* Panneau Analyse : la télémétrie seule dans l'écran principal ; les autres onglets dans la fenêtre « Analyse »
       (sans la comparaison, calculée par le serveur de l'appli) */
    html.web:not(.only-analysis, .only-compare) .p-analysis .panel-head [data-tab]:not([data-tab="telemetry"]),
    html.web.only-analysis .p-analysis .panel-head [data-tab="telemetry"] { display: none !important; }
    /* Fenêtre « Comparaison » : le panneau Analyse réduit à cet onglet */
    html.web.only-compare .p-analysis .panel-head > :not([data-tab="compare"]) { display: none !important; }
    html.web.only-compare .p-analysis .panel-head > [data-tab="compare"] { display: inline-flex !important; }
    html.web.only-compare .cmp-pop { display: none; }
    /* Pas de séance en direct : compte à rebours, puis résultats et classements sur demande (replays dans l'appli) */
    .web .nl-actions { display: none; }
    .web .nolive-view { flex-direction: column; justify-content: flex-start; }
    .web .nolive-view > .nl-box { margin-top: auto; }
    .web .web-res { width: 100%; max-width: 820px; margin: 14px auto auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .web .web-res-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .web .web-res-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .web .web-res-card h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: var(--text-2); }
    .web .web-res-card ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
    .web .web-res-card li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
    .web .web-res-card li b { font-variant-numeric: tabular-nums; }
    .web .web-res-card li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .web .web-res-card li small { color: var(--text-2); font-variant-numeric: tabular-nums; }
    /* Météo de la piste dans la barre du haut, comme l'appli (sur sa propre ligne sur téléphone) */
    .web .topbar .weather-mini { display: flex !important; }
    .web .season-view { left: 0 !important; }
    .web #webMenuBtn { display: none; }
    /* Bouton Saison dans la barre du haut (l'appli l'a dans son menu latéral) */
    .web .topbar #seasonBtn { display: inline-flex !important; }
    .web .topbar #seasonBtn:not(.on) { border-color: rgba(255, 255, 255, .18); }
    /* Espace Saison : toutes les rubriques de l'appli, avec les intertitres du menu */
    .web #szNav button[data-full]:not(.sz-shut) { display: flex !important; }   /* sauf rubriques d'un groupe replié (Télémétrie) */
    .web #szNav .sz-nav-sep { display: block !important; }
    /* Écran affiché : les panneaux vides dessous sont retirés, la page ne défile plus */
    .web body:has(#noLiveView:not([hidden])) { overflow: hidden; }
    .web body:has(#noLiveView:not([hidden])) .grid { display: none; }
    /* Espace Saison ouvert : seule la Saison défile au doigt (pas la page du direct dessous) */
    .web body:has(#seasonView:not([hidden])) { overflow: hidden; }
    html.web:not(.only) body:has(#seasonView:not([hidden]), #homeView:not([hidden])) .grid { display: none; }
    /* Bandeau de la direction de course : seulement avec l'écran du direct (pas sur la Saison, hors séance ni dans une fenêtre) */
    html.web:is(.only) .rc-bar, .web body:has(#seasonView:not([hidden]), #noLiveView:not([hidden]), #homeView:not([hidden])) .rc-bar { display: none !important; }
    .web #szContent { overscroll-behavior: contain; }
    html.web:has(#seasonView:not([hidden])), .web body:has(#seasonView:not([hidden])) { overscroll-behavior: none; }   /* pas de rebond de la page (iPhone) */
    /* Saison ouverte : la séance en haut ramène au direct ; pas de favoris à choisir dans la version web */
    .web body:has(#seasonView:not([hidden])) .topbar .session { cursor: pointer; }
    .web .sz-favs { display: none; }
    .web .topbar #seasonBtn .ic { width: 18px; height: 18px; }
    @media (max-width: 900px) { .web .topbar #seasonBtn .ic { width: 22px; height: 22px; } }
    .web .topbar #seasonBtn { gap: 6px; }
    /* La page ne glisse jamais de côté (seuls les tableaux larges défilent, dans leur cadre) */
    html.web, .web body { overflow-x: clip; overscroll-behavior-x: none; }
    .web .topbar .web-delay { display: flex; align-items: center; gap: 6px; }
    .web .topbar .web-delay input { width: 54px; height: 34px; padding: 0 4px; text-align: center; border: 1px solid var(--border); border-radius: 8px;
      background: var(--panel-2); color: var(--text); font: 700 17px/1 inherit; font-variant-numeric: tabular-nums; }
    .web .topbar .web-delay .unit { color: var(--text-2); font-weight: 700; margin-left: -2px; }
    /* iPhone (page installée) : barre du haut fixée en haut, fond plein jusque sous la barre d'état, comme l'en-tête
       du Studio. Sans élément fixé en haut, iOS floute le haut de la page (titre de la séance flou) */
    .web body { padding-top: 0; }
    /* iPhone : zone de l'heure et de la batterie de la couleur de la barre du haut. L'iPhone la remplit avec le fond de
       la page (fond de html, le body garde le sien) ou laisse voir la page dessous (bande fixée de la hauteur de la zone) */
    html.web:is([data-design="v2"], [data-scheme="dark"]) { background-color: #0C1326; }
    html.web:is([data-design="v2"], [data-scheme="dark"])::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #0C1326; z-index: 801; pointer-events: none; }
    .web .topbar { position: sticky; top: 0; z-index: 800; padding-top: calc(8px + env(safe-area-inset-top)); background: linear-gradient(180deg, #0F172A, #0A1120); }
    .web .web-wait { padding: 8px 14px; background: var(--panel-2); border-bottom: 1px solid var(--border); color: var(--text); font-size: 13px; font-weight: 600; text-align: center; }
    /* Appairage d'un téléphone (version web avec compte F1 TV, sans extension) */
    .pair-dlg { width: calc(100% - 24px); max-width: 420px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); color: var(--text); padding: 20px; }
    .pair-dlg::backdrop { background: rgba(0, 0, 0, .6); }
    /* Nouveautés : journal léger (3 dernières versions), la plus récente ouverte ; point rouge s'il y a du nouveau */
    .cl-dlg { max-width: 560px; max-height: min(80dvh, 720px); overflow-y: auto; }
    .cl-web h5 { margin: 14px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .cl-web ul { margin: 0; padding-left: 18px; } .cl-web li { margin: 4px 0; line-height: 1.45; font-size: 14px; }
    .cl-web details { border-top: 1px solid var(--line); padding: 8px 0; } .cl-web summary { cursor: pointer; font-weight: 700; }
    #clBtn.fresh::after { content: ''; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--red, #e10600); display: inline-block; }
    .pair-close { display: flex; justify-content: flex-end; margin: -8px -8px 0 0; }
    .pair-close button { background: none; border: none; color: var(--text-2); font-size: 18px; line-height: 1; cursor: pointer; padding: 4px 8px; }
    .pair-title { margin: 0 0 12px; font-size: 18px; }
    .pair-h { margin: 0 0 14px; font-size: 14px; line-height: 1.45; color: var(--text-2); }
    .pair-code { font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: .2em; text-indent: .2em; text-align: center; padding: 16px 0; background: var(--panel-2); border-radius: 10px; margin: 0 0 12px; font-variant-numeric: tabular-nums; }
    .pair-note { margin: 10px 0 0; font-size: 13px; color: var(--text-2); }
    .pair-note.err { color: #ff6b6b; }
    .pair-ok { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; background: rgba(46, 204, 113, .12); color: var(--text); font-size: 14px; line-height: 1.45; }
    .pair-ok small { color: var(--text-2); }
    .pair-out { width: 100%; margin-top: 14px; }
    .web .topbar :is(#pairBtn, #seasonBtn) { color: var(--text); background: transparent; border: 1px solid rgba(255, 255, 255, .18); }   /* barre toujours sombre, même en apparence claire */
    /* Point vert avant le texte : ::after placé en tête (::before sert de zone tactile au doigt, style.css) */
    #pairBtn.on { display: inline-flex; align-items: center; }
    #pairBtn.on::after { content: ''; order: -1; flex: none; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
    #pairForm { display: flex; gap: 8px; }
    #pairInput { flex: 1; min-width: 0; font-weight: 700; font-size: 22px; letter-spacing: .25em; text-align: center; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); color: var(--text); font-variant-numeric: tabular-nums; }
    .web [data-full], .web .map-mode + label + #mapFloatBtn { display: none !important; }
    /* Menu ouvert (calques, options) : son panneau passe devant les autres */
    .web .panel:has(details[open]) { position: relative; z-index: 30; overflow: visible; }
    /* Classement sans boutons duel (pas de panneau Duel en ligne) ni menu des colonnes (réglé par l'appli) */
    .web .tower .c-duel, .web .p-tower .hint, .web #towerCols { display: none !important; }
    @media (max-width: 1300px) {
      /* La page défile ; sa hauteur suit son contenu, sinon la barre du haut fixée quittait l'écran en bas du body */
      .web body { overflow: auto; height: auto; min-height: 100dvh; }
      /* Barre du haut fixée : elle ne bouge jamais, ni au défilement ni quand l'iPhone étire le haut de la page
         (une barre « sticky » descendait avec la page et passait sous l'écran sans direct) ; la page commence sous elle */
      html.web body .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 800; }   /* passe devant la règle des écrans peu hauts */
      .web body { padding-top: var(--web-top, 0px); }
      html.web { overscroll-behavior-y: none; }
      .web .grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); grid-template-rows: 560px 440px 440px;
        grid-template-areas: "tower map" "tele radio" "feed feed"; }
    }
    @media (max-width: 900px) {
      .web .grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "map" "tower" "tele" "feed" "radio"; }
      .web .p-map { height: 380px; } .web .p-feed, .web .p-radio, .web .p-analysis { height: 440px; }
      .web .grid { flex: none; }
    }
    /* Téléphone, en portrait comme en paysage (écran peu haut) : menus, classement et réglages du direct */
    @media (max-width: 900px), (max-height: 500px) and (orientation: landscape) {
      /* Téléphone : le circuit reste dans la page (pas de fenêtres à part), comme dans l'appli sur téléphone */
      .web .win-btn { display: none; }
      /* Menus en bas de l'écran, sur toute la largeur, défilement au doigt (comme l'appli sur téléphone) */
      .web .map-layers-menu { position: fixed; left: 8px; right: 8px; top: auto; bottom: calc(12px + env(safe-area-inset-bottom));
        width: auto; max-height: 60dvh; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; z-index: 900; }
      .web .map-layers-menu .toggle { white-space: normal; }
      /* Téléphone : classement en entier, toute sa hauteur dans la page (pas de défilement vertical dans le
         défilement) ; les colonnes défilent de côté, position et pilote restent fixes à gauche */
      .web .p-tower { height: auto; }
      .web .p-tower .tower-wrap { overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: none; flex: none; height: auto; }
      .web .tower { zoom: 1 !important; --tower-row-h: 34px !important; }
      .web .tower :is(.drv-num, .drv-last, .fav-btn) { display: none !important; }
      .web .tower td, .web .tower th { padding-left: 3px; padding-right: 3px; }
      .web .tower .drv { gap: 5px; }
      .web .tower :is(td, th):nth-child(-n+2) { position: sticky; z-index: 3; background: var(--panel); }
      .web .tower :is(td, th):first-child { left: 0; width: 36px; min-width: 36px; max-width: 36px; box-sizing: border-box; }
      .web .tower :is(td, th):nth-child(2) { left: 36px; box-shadow: 6px 0 6px -6px rgba(0, 0, 0, .35); }
      .web .tower tr.danger td:nth-child(-n+2) { background: linear-gradient(rgba(255, 59, 48, .07), rgba(255, 59, 48, .07)), var(--panel); }
      .web .tower tr.focus td:nth-child(-n+2) { background: linear-gradient(var(--focus), var(--focus)), var(--panel); }
      .web .tower tr.fin td:nth-child(-n+2) { background: var(--chequer) 0 0 / 16px 16px, var(--panel); }
      .web .tower tr.out td:nth-child(-n+2) { opacity: 1; }
      .web .tower tr.out td:nth-child(-n+2) > * { opacity: .45; }
      .web .web-delay .hstat-label { display: none; }
      .web .web-delay, .web #sourceBadge, .web .topbar > .btn { order: 5; }
      .web .web-delay { margin-right: auto; }
      .web .topbar .weather-mini { order: 4; flex-basis: 100%; max-height: none; gap: 14px; }
      /* Réglages du direct (délai, F1 TV, état du serveur, Saison, appli) derrière l'engrenage : la barre du haut
         garde la séance, le chrono et les infos (longueur, course, météo, piste) */
      .web #webMenuBtn { display: inline-flex; order: 2; margin-left: 2px; color: #fff; }   /* après l’état de la piste et la Saison */
      .web .topbar:not(.menu-open) > :is(.web-delay, #pairBtn, #sourceBadge, #clBtn, a.btn, #tbTools) { display: none !important; }
      /* Saison : icône à côté de l'engrenage, toujours là */
      .web .topbar #seasonBtn, .web .topbar #seasonBtn:not(.on) { order: 1; padding: 6px; gap: 0; border-color: transparent; color: #fff; }
      .web .topbar #seasonBtn .sz-lbl { display: none; }
      .web .topbar.menu-open #webMenuBtn { background: rgba(255, 255, 255, .14); border-radius: 8px; }
      /* Espace Saison ouvert : la barre du haut ne garde que la séance (délai, F1 TV, chronos servent au direct) ;
         « Retour au direct » est dans le menu ☰ */
      .web body:has(#seasonView:not([hidden]), #homeView:not([hidden])) .topbar > :not(.session, .track-status) { display: none !important; }
    }
    /* Téléphone en paysage : rien sous l'encoche ni la Dynamic Island, barre du haut sur une ligne (météo dans le
       direct), classement et carte côte à côte sur toute la hauteur de l'écran, le reste dessous */
    @media (max-height: 500px) and (orientation: landscape) {
      .web body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
      html.web body .topbar { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
      .web .topbar .weather-mini { display: none !important; }
      .web .topbar { flex-wrap: nowrap; row-gap: 0; }
      .web .topbar :is(.tb-break, .brand, .session-sub) { display: none !important; }
      .web .topbar .session-name { font-size: 18px; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .web .topbar .hstat-value { font-size: 22px !important; }
      .web .topbar #clockValue { font-size: 24px !important; }
      .web .grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-rows: calc(100dvh - var(--web-top, 0px) - 16px) 360px 360px;
        grid-template-areas: "tower map" "tele feed" "radio radio"; }
      .web .p-tower { height: auto; min-height: 0; overflow: auto; }
      .web .p-tower .tower-wrap { overflow: auto; }
    }
    /* Menu : Accueil, Direct, Saison. Ordinateur : dans la barre du haut, à côté du logo ; téléphone : barre fixée en bas
       (celle de l'appli), la Saison n'a plus d'icône en haut */
    .web .topbar #seasonBtn { display: none !important; }
    .web .web-nav { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); flex: none; }
    .web .web-nav button { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 0; border-radius: 999px; background: none; color: #CBD5E1; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .web .web-nav button:hover { color: #fff; background: rgba(255, 255, 255, .08); }
    .web .web-nav button.active { color: #fff; background: var(--v2-red, #e10600); }
    .web .web-nav .mn-svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .web .web-mnav { display: none; }
    .web a.hm-news-item { text-decoration: none; }
    @media (max-width: 900px) {
      .web .web-nav { display: none; }
      .web .web-mnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; }
      .web body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
      /* Accueil, Saison (et son menu des rubriques), « Pas de séance » : jusqu'en bas de l'écran, derrière le menu fixé ; place laissée à la fin du contenu */
      .web :is(#homeView .hm-main, #szContent, #noLiveView, #seasonView .sz-side) { padding-bottom: calc(96px + env(safe-area-inset-bottom)) !important; }
    }
    @media (max-width: 1200px) and (min-width: 901px) { .web .web-nav .mn-l { display: none; } .web .web-nav button { padding: 6px 9px; } }
    html.web.only :is(.web-nav, .web-mnav) { display: none !important; }
    /* Fenêtres « Circuit », « Analyse » et « Duel » (/live/?only=map, analysis, duel) : le panneau seul, sur toute la fenêtre */
    html.web.only body { height: 100dvh; overflow: hidden; padding: 0 !important; }
    html.web.only :is(.topbar, #seasonView, #homeView) { display: none !important; }
    html.web.only .grid { display: grid; flex: 1; grid-template: "only" minmax(0, 1fr) / minmax(0, 1fr); }
    html.web.only .grid > .panel { display: none; }
    html.web.only-map .grid > .p-map, html.web.only-analysis .grid > .p-analysis, html.web.only-duel .grid > .p-duel, html.web.only-compare .grid > .p-analysis { display: flex; grid-area: only; height: auto; }
    /* Télémétrie (design par défaut, v1.32) : barre du haut couleur du fond, en sombre comme en clair ; elle passe à la
       ligne plutôt que de couper sa fin (la version web y a plus de commandes que l'appli) */
    html.web[data-design="v3"] .topbar { flex-wrap: wrap; row-gap: 4px; }
    html.web[data-design="v3"]:is([data-scheme="dark"]) { background-color: var(--bg); }
    html.web[data-design="v3"][data-scheme="dark"]::before { background: var(--bg); }
    html.web[data-design="v3"] .web-nav { border-radius: var(--r-sm); background: var(--panel-2); border-color: var(--border); padding: 2px; }
    html.web[data-design="v3"] .web-nav button { border-radius: var(--r-xs); color: var(--text-2); font: 600 var(--fs-sm)/1 var(--font); min-height: 32px; position: relative; }
    html.web[data-design="v3"] .web-nav button:hover { color: var(--text); background: var(--panel-3); }
    html.web[data-design="v3"] .web-nav button.active { color: var(--text); background: var(--panel-3); }
    html.web[data-design="v3"] .web-nav button.active::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--accent); }
    html.web[data-design="v3"] .topbar :is(#pairBtn, #seasonBtn) { color: var(--text); border-color: var(--line-2); }
    html.web[data-design="v3"] .topbar #webMenuBtn { color: var(--text); }
    html.web[data-design="v3"] .topbar .web-delay input { font-family: var(--font-mono); font-weight: 600; border-radius: var(--r-sm); }
    html.web[data-design="v3"] .web-res-card { border-radius: var(--r-md); }
    html.web[data-design="v3"] .web-res-card h3 { font: 500 var(--fs-2xs)/1.3 var(--font-mono); letter-spacing: .08em; color: var(--muted); }
    /* Ordinateur : deuxième ligne régulière, réglages du direct à gauche (délai, F1 TV, source), fenêtres, Nouveautés et
       appli complète à droite, avec leur nom dès 1200 px */
    @media (min-width: 901px) and (max-width: 2399px) {
      html.web[data-design="v3"] .topbar .tb-break.b2 { display: block !important; flex-basis: 100%; height: 0; margin: 0; }
      html.web[data-design="v3"] .topbar .win-btn[data-win="analysis"] { margin-left: auto; }
    }
    @media (min-width: 1200px) {
      html.web[data-design="v3"] .topbar .win-btn { padding: 0 var(--sp-3); }
      html.web[data-design="v3"] .topbar .win-btn .wb-lbl { display: inline; }
    }
    @media (max-width: 900px), (max-height: 500px) and (orientation: landscape) {
      html.web .win-btn { display: none !important; }   /* téléphone : pas de fenêtres à part (Télémétrie affiche les .btn) */
      html.web[data-design="v3"] .topbar #webMenuBtn { min-width: 40px; min-height: 40px; }
      html.web[data-design="v3"] .topbar.menu-open #webMenuBtn { background: var(--panel-3); }
    }
    /* Téléphone en paysage : le menu devient le rail de gauche de Télémétrie ; la page et la barre du haut commencent après */
    @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
      html.web[data-design="v3"] body { padding-left: var(--mrail) !important; padding-bottom: env(safe-area-inset-bottom); }
      html.web[data-design="v3"] body .topbar { left: var(--mrail); padding-right: max(var(--sp-3), env(safe-area-inset-right)); }
      html.web[data-design="v3"] .season-view { left: var(--mrail) !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo" src="/live/logo.svg" alt="Paddock Live"><span class="brand-name">PADDOCK LIVE</span></div>
    <div class="session">
      <img class="session-flag" id="sessionFlag" alt="" hidden>
      <div class="session-txt">
        <div class="session-name" id="sessionName">Connexion…</div>
        <div class="session-sub" id="sessionSub"></div>
      </div>
    </div>
    <nav class="web-nav" id="webNavTop" aria-label="Navigation"><button type="button" data-nav="home" aria-label="Accueil" class="active" aria-current="page"><svg class="mn-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10"/></svg><span class="mn-l">Accueil</span></button><button type="button" data-nav="live" aria-label="Direct"><svg class="mn-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/></svg><span class="mn-l">Direct</span></button><button type="button" data-nav="season" aria-label="Saison"><svg class="mn-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM12 13v4M8 20h8M16 6h3a3 3 0 0 1-3 4M8 6H5a3 3 0 0 0 3 4"/></svg><span class="mn-l">Saison</span></button></nav>
    <div class="track-status" id="trackStatus"><span class="ts-dot"></span><span class="ts-label">—</span></div>
    <button class="icon-btn" id="webMenuBtn" title="Réglages du direct" aria-label="Réglages du direct" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg></button>
    <div class="tb-break b1"></div>
    <div class="hstat lap-box"><div class="hstat-label" id="lapLabel">Tour</div><div class="hstat-value" id="lapValue">—</div><div class="lap-bar" id="lapBar" hidden><i></i></div></div>
    <div class="hstat" id="lapsLeftBox" hidden><div class="hstat-label">Tours restants</div><div class="hstat-value" id="lapsLeft">—</div></div>
    <div class="hstat clock-box" id="clockBox"><div class="hstat-label">Temps restant</div><div class="hstat-value" id="clockValue">—</div></div>
    <div class="hstat" id="circuitTimeBox" hidden><div class="hstat-label">Heure circuit</div><div class="hstat-value" id="circuitTime">—</div></div>
    <div class="hstat weather-mini" id="weatherMini"></div>
    <div class="hstat surface" id="surfaceBox" hidden><div class="hstat-label">État piste</div><div class="hstat-value" id="surfaceValue">—</div></div>
    <button type="button" class="tb-more" id="tbMore" aria-expanded="false" aria-controls="tbTools" title="Outils : documents FIA, vitesses, secteurs, météo, championnat"><svg class="ic tm-ic" aria-hidden="true"><use href="#i-wrench"/></svg>Outils <svg class="ic" aria-hidden="true"><use href="#i-chevron-down"/></svg></button>
    <div class="tb-tools" id="tbTools">
      <button class="tb-tool" data-tool="docs" title="Documents officiels de la FIA (Grand Prix en cours)"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg><small>FIA</small><i class="tb-dot" hidden></i></button>
      <button class="tb-tool" data-tool="speeds" title="Vitesses aux points de mesure"><svg viewBox="0 0 24 24"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1.3"/></svg><small>Vitesses</small></button>
      <button class="tb-tool" data-tool="sectors" title="Meilleurs secteurs de chaque pilote et tour idéal"><svg viewBox="0 0 24 24"><path d="M5 20V11M10 20V5M15 20v-7M20 20V9"/></svg><small>Secteurs</small></button>
      <button class="tb-tool" data-tool="weather" title="Météo et radar de pluie du circuit"><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg><small>Météo</small></button>
      <button class="tb-tool" data-tool="champ" title="Championnat pilotes et constructeurs, avec la projection en direct pendant les courses"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"/></svg><small>Championnat</small></button>
    </div>
    <div class="spacer"></div>
    <div class="tb-break b2"></div>
    <div class="web-delay" title="Délai TV : l'affichage attend autant que votre diffusion">
      <span class="hstat-label">Délai</span>
      <button class="dbtn m" data-step="-5000">−5</button>
      <button class="dbtn m" data-step="-1000">−1</button>
      <input id="delayInput" type="text" inputmode="decimal" aria-label="Délai en secondes"><span class="unit">s</span>
      <button class="dbtn" data-step="1000">+1</button>
      <button class="dbtn" data-step="5000">+5</button>
    </div>
    <button class="btn small" id="pairBtn" title="Utiliser son compte F1 TV sur cet appareil" hidden></button>
    <button class="source-badge" id="sourceBadge"><span class="src-dot"></span><span id="sourceLabel">—</span></button>
    <button class="btn small win-btn" data-win="analysis" title="Écarts, temps, secteurs, arrêts, stratégie et bagarres dans une fenêtre à part"><svg class="ic" aria-hidden="true"><use href="#i-layout"/></svg><span class="wb-lbl">Analyse</span></button>
    <button class="btn small win-btn" data-win="duel" title="Duel des deux pilotes cliqués dans le classement, dans une fenêtre à part"><svg class="ic" aria-hidden="true"><use href="#i-duel"/></svg><span class="wb-lbl">Duel</span></button>
    <button class="btn small win-btn" data-win="compare" title="Comparaison des tours de deux pilotes, dans une fenêtre à part"><svg class="ic" aria-hidden="true"><use href="#i-swap"/></svg><span class="wb-lbl">Comparaison</span></button>
    <button class="btn small" id="seasonBtn" title="Calendrier, classements et résultats de la saison" aria-label="Saison"><svg class="ic" aria-hidden="true"><use href="#i-trophy"/></svg><span class="sz-lbl">Saison</span></button>
    <button class="btn small" id="clBtn" title="Ce qui a changé dans Paddock Live">Nouveautés</button>
    <a class="btn small btn-accent" href="https://paddocklive.app/" title="Télécharger l'appli Paddock Live">Appli complète</a>
  </header>

  <div id="weatherHold" hidden><div id="weather" class="wx-pop-body"></div></div>
  <div class="web-wait" id="webWait" role="status" hidden></div>
  <div class="flag-banner" id="flagBanner" hidden><span class="fb-icon"></span><span class="fb-text"></span><span class="fb-sub"></span></div>

  <div class="season-view nolive-view" id="noLiveView" hidden>
    <div class="nl-box" id="noLiveBox"></div>
    <div class="web-res" id="webResults"><button class="btn" id="webResultsBtn" title="Résultat visible : pas de spoiler tant que vous ne cliquez pas">Voir les résultats et les classements</button></div>
  </div>

  <!--home-->
  <!--season-->

  <main class="grid">
    <!--panel:tower-->
    <!--panel:map-->
    <!--panel:analysis-->
    <!--panel:feed-->
    <!--panel:radio-->
    <!--panel:extra-->
    <!--panel:duel-->
  </main>

  <!-- Bandeau du bas : dernier message de la direction de course, comme l'appli (feed.js, renderRcm) -->
  <div class="rc-bar" id="rcBar" hidden><span class="rc-tag">Direction de course</span><i class="rcm-flag"></i><span class="rc-msg"></span><small class="rc-lap"></small></div>

  <!-- Téléphone : Accueil, Direct et Saison en bas de l'écran (web.js) -->
  <nav class="mob-nav web-mnav" id="webNav" aria-label="Navigation"><button type="button" data-nav="home" aria-label="Accueil" class="active" aria-current="page"><svg class="mn-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10"/></svg><span class="mn-l">Accueil</span></button><button type="button" data-nav="live" aria-label="Direct"><svg class="mn-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/></svg><span class="mn-l">Direct</span></button><button type="button" data-nav="season" aria-label="Saison"><svg class="mn-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM12 13v4M8 20h8M16 6h3a3 3 0 0 1-3 4M8 6H5a3 3 0 0 0 3 4"/></svg><span class="mn-l">Saison</span></button></nav>

  <dialog id="pairDlg" class="pair-dlg">
    <form method="dialog" class="pair-close"><button value="x" aria-label="Fermer" title="Fermer">✕</button></form>
    <h2 class="pair-title">Connexion F1 TV</h2>
    <div id="pairBody"></div>
  </dialog>

  <dialog id="clDlg" class="pair-dlg cl-dlg">
    <form method="dialog" class="pair-close"><button value="x" aria-label="Fermer" title="Fermer">✕</button></form>
    <h2 class="pair-title">Nouveautés</h2>
    <div id="clBody" class="cl-web" data-no-i18n></div>
  </dialog>

  <div class="toast" id="toast" popover="manual" hidden></div>
  <script type="module" src="/live/js/web.js"></script>
</body>
</html>
