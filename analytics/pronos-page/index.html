<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronostics F1 · Paddock Live</title>
<meta name="description" content="Pronostics entre amis : pole et podium de chaque Grand Prix de Formule 1.">
<meta name="robots" content="noindex">
<link rel="icon" href="/app/icon-512.png">
<link rel="stylesheet" href="/legal/style.css">
<style>
  /* Groupe de pronostics en ligne : même contenu que la vue Pronostics de l'appli Paddock Live */
  .box { background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin: 16px 0; -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shadow); }
  .box h2 { margin: 0 0 12px; font-size: 22px; }
  .box h2 small { font: 600 14px 'Titillium Web', sans-serif; text-transform: none; color: var(--dim); }
  .dim, small { color: var(--dim); }
  label { display: grid; gap: 6px; font-size: 14px; color: var(--dim); }
  input, select { font: inherit; color: var(--fg); background: rgba(2, 6, 18, .55); border: 1px solid var(--line-2); border-radius: 14px; padding: 10px 14px; width: 100%; min-height: 44px; }
  select { border-radius: 999px; }
  input:focus, select:focus { outline: 2px solid rgba(255, 59, 48, .55); outline-offset: 1px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
  button { font: inherit; font-weight: 700; background: var(--red-grad); color: #fff; border: 0; border-radius: 999px; padding: 12px 24px; min-height: 44px; cursor: pointer; box-shadow: var(--red-glow); }
  button:disabled { opacity: .6; }
  button.link { background: none; color: var(--dim); padding: 4px 8px; min-height: 0; font-weight: 500; text-decoration: underline; box-shadow: none; }
  button.ghost { background: rgba(255, 255, 255, .05); color: #ff7a73; border: 1px solid var(--line-2); box-shadow: none; }
  .mg { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  tr.me td { background: rgba(225, 6, 0, .12); }
  .hit { color: #3ddc84; } .near { color: #e8c35a; }
  .msg { margin: 10px 0 0; font-size: 14px; }
  .msg.bad { color: #ff7a73; } .msg.ok { color: #3ddc84; }
  details summary { cursor: pointer; }
  details summary::marker { color: #ff3b30; }
  details[open] summary { margin-bottom: 10px; }
  .scroll { overflow-x: auto; }
  footer { color: var(--dim); font-size: 14px; margin-top: 40px; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1><span>Pronostics</span> <b id="gname">F1</b></h1>
  <p class="date">Pole et podium de chaque Grand Prix, entre amis · <a href="/">Paddock Live</a></p>
  <div id="root"><p class="dim">Chargement…</p></div>
  <footer>Fermés au début des qualifs (pole) et au départ de la course (podium), puis révélés. <a href="/p/">Créer un autre groupe</a></footer>
</main>
<script>
  const id = location.pathname.split('/').filter(Boolean)[1] || '';
  const KEY = `pronos.tok.${id}`;
  const store = { get: (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* navigation privée */ } } };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fmt = (t) => (t ? new Date(t).toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—');
  const gp = (r) => r.fr || String(r.name || '').replace(/ Grand Prix.*$/, '');
  let view = null;
  const sig = (v) => JSON.stringify({ ...v, now: 0 });
  // Lien personnel (#k=jeton) : le pseudo de ce joueur sur un autre appareil ; jeton gardé, adresse nettoyée
  const k = /[#&]k=([\w-]{20,64})/.exec(location.hash)?.[1];
  if (id && k) { store.set(KEY, k); history.replaceState(null, '', location.pathname); }
  // Groupes ouverts dans ce navigateur (« Mes groupes »), le plus récent en tête
  const myGroups = () => { try { return JSON.parse(store.get('pronos.groups') || '[]'); } catch { return []; } };
  const remember = (g) => store.set('pronos.groups', JSON.stringify([{ id: g.id, name: g.name }, ...myGroups().filter((x) => x.id !== g.id)].slice(0, 20)));
  // Retiré de « Mes groupes » (ce navigateur seulement : le groupe reste en ligne pour les autres)
  const forget = (gid) => store.set('pronos.groups', JSON.stringify(myGroups().filter((x) => x.id !== gid)));

  // quiet : relecture automatique (pronostics des autres) ; rien n'est redessiné si rien n'a changé ou
  // pendant la saisie, et les choix en cours sont gardés
  async function load(quiet = false) {
    const r = await fetch(`/p/api/${id}?tok=${encodeURIComponent(store.get(KEY))}`);
    const v = await r.json();
    if (!r.ok) { if (!quiet) document.getElementById('root').innerHTML = `<p class="msg bad">${esc(v.error || 'Groupe indisponible')}</p>`; return; }
    const f = document.getElementById('f');
    if (quiet && (sig(v) === sig(view) || f?.contains(document.activeElement))) return;
    const keep = quiet && f ? Object.fromEntries(new FormData(f)) : null;
    view = v;
    if (!quiet) remember(view.group);
    document.getElementById('gname').textContent = view.group.name;
    document.title = `${view.group.name} · Pronostics F1`;
    render();
    const g = document.getElementById('f');
    if (keep && g) for (const [k, val] of Object.entries(keep)) if (g.elements[k] && !g.elements[k].disabled) g.elements[k].value = val;
    if (g) lockPodium(g);
  }
  // Podium : un pilote choisi à une place ne peut pas être choisi aux deux autres
  function lockPodium(f) {
    const sels = ['p1', 'p2', 'p3'].map((n) => f.elements[n]);
    for (const s of sels) for (const o of s.options) o.disabled = !!o.value && sels.some((x) => x !== s && x.value === o.value);
  }

  const select = (name, value, off) => `<label>${{ pole: 'Pole position', p1: '1er', p2: '2e', p3: '3e' }[name]}<select name="${name}" ${off ? 'disabled' : ''}><option value="">—</option>${view.drivers.map((d) => `<option value="${esc(d.code)}" ${d.code === value ? 'selected' : ''}>${esc(d.code)} · ${esc(d.name)}</option>`).join('')}</select></label>`;
  const cell = (code, pts) => (!code ? '<td class="dim">—</td>' : code === '?' ? '<td class="dim" title="Révélé à la fermeture">caché</td>' : `<td class="${pts >= 3 ? 'hit' : pts ? 'near' : ''}">${esc(code)}${pts ? ` <small>+${pts}</small>` : ''}</td>`);
  const table = (r) => (r.picks.length ? `<div class="scroll"><table><tr><th>Joueur</th><th>Pole</th><th>1er</th><th>2e</th><th>3e</th><th>Points</th></tr>${r.picks.map((p) => `<tr class="${p.mine ? 'me' : ''}"><td>${esc(p.name)}</td>${cell(p.pole, p.points?.pole)}${cell(p.p1, p.points?.podium[0])}${cell(p.p2, p.points?.podium[1])}${cell(p.p3, p.points?.podium[2])}<td><b>${p.points ? p.points.total : '—'}</b></td></tr>`).join('')}</table></div>` : '<p class="dim">Aucun pronostic.</p>');

  function render() {
    const now = Date.now();
    const next = view.races.find((r) => !r.result && r.locks.podium && r.locks.podium > now);
    const mine = next?.picks.find((p) => p.mine) || {};
    const poleOpen = next && (!next.locks.pole || now < next.locks.pole);
    const others = next ? next.picks.filter((p) => !p.mine).length : 0;
    const name = mine.name || store.get('pronos.name');
    const form = next ? `<section class="box"><h2>${esc(gp(next))} <small>· manche ${next.round}</small></h2>
      <form id="f"><label>Votre prénom ou pseudo<input name="name" value="${esc(name)}" maxlength="24" required placeholder="ex. Benjamin"></label>
        <div class="picks">${select('pole', mine.pole, !poleOpen)}${select('p1', mine.p1)}${select('p2', mine.p2)}${select('p3', mine.p3)}</div>
        <button type="submit">Enregistrer mon pronostic</button>
        <p class="dim msg">Pole : ${poleOpen ? `jusqu'au ${fmt(next.locks.pole)}` : 'fermé (qualifications commencées)'} · Podium : jusqu'au ${fmt(next.locks.podium)}${others ? ` · ${others} autre${others > 1 ? 's' : ''} joueur${others > 1 ? 's ont' : ' a'} déjà pronostiqué` : ''}</p>
        <p class="msg" id="msg"></p></form></section>` : '<section class="box"><p class="dim">Plus de Grand Prix à pronostiquer cette saison.</p></section>';
    const done = view.races.filter((r) => r.result && r.picks.length).reverse();
    const meName = (name || '').toLowerCase();
    const board = view.board.length ? `<div class="scroll"><table><tr><th>#</th><th>Joueur</th><th>Points</th></tr>${view.board.map((p, i) => `<tr class="${p.name.toLowerCase() === meName ? 'me' : ''}"><td>${i + 1}</td><td>${esc(p.name)}</td><td><b>${p.total}</b></td></tr>`).join('')}</table></div>`
      : '<p class="dim">Le classement apparaîtra après le premier Grand Prix pronostiqué.</p>';
    const waiting = view.races.filter((r) => !r.result && r.picks.length && r !== next);
    document.getElementById('root').innerHTML = `${form}
      <section class="box"><h2>Classement ${view.year}</h2>${board}<p class="dim msg">Points : pole 3 · bonne place du podium 3 · sur le podium 1 · podium exact +2.</p></section>
      ${waiting.map((r) => `<section class="box"><h2>R${r.round} · ${esc(gp(r))} <small>en attente des résultats</small></h2>${table(r)}</section>`).join('')}
      ${done.map((r, i) => `<details class="box" ${i === 0 ? 'open' : ''}><summary><b>R${r.round} · ${esc(gp(r))}</b> <small>pole ${esc(r.result.pole || '—')} · podium ${esc(r.result.podium.join(', ') || '—')}</small></summary>${table(r)}</details>`).join('')}`;
    const f = document.getElementById('f');
    if (f) f.onchange = () => lockPodium(f);
    if (f) f.onsubmit = async (e) => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(f));
      const msg = document.getElementById('msg');
      f.querySelector('button').disabled = true;
      try {
        const r = await fetch(`/p/api/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ year: view.year, round: next.round, name: v.name, pole: v.pole || null, p1: v.p1 || null, p2: v.p2 || null, p3: v.p3 || null, tok: store.get(KEY) || undefined }) });
        const out = await r.json();
        if (!r.ok) throw new Error(out.error || 'Erreur');
        store.set(KEY, out.tok);
        store.set('pronos.name', v.name.trim());
        myLink();
        await load();
        const m = document.getElementById('msg');
        if (m) { m.className = 'msg ok'; m.textContent = 'Pronostic enregistré'; }
      } catch (err) { msg.className = 'msg bad'; msg.textContent = err.message; f.querySelector('button').disabled = false; }
    };
  }
  // Sans groupe dans l'adresse (paddocklive.app/p/) : création d'un groupe, sans l'application
  function createPage() {
    document.getElementById('gname').textContent = 'entre amis';
    const mine = myGroups();
    document.getElementById('root').innerHTML = `${mine.length ? `<section class="box"><h2>Mes groupes</h2>${mine.map((g) => `<p class="mg"><a href="/p/${esc(g.id)}">${esc(g.name)}</a><button type="button" class="link" data-forget="${esc(g.id)}" title="Retirer de ce navigateur">Retirer</button></p>`).join('')}
      <p class="dim msg">Sur un autre appareil : votre lien personnel, en bas de la page du groupe.</p></section>` : ''}
      <section class="box"><h2>Créer un groupe</h2>
      <form id="nf"><label>Nom du groupe<input name="name" maxlength="40" required placeholder="ex. Les copains"></label>
        <p><button type="submit">Créer le groupe</button></p><p class="msg" id="msg"></p></form>
      <p class="dim msg">Vous recevez un lien à envoyer à vos amis : ils jouent depuis cette page, sans rien installer.</p></section>`;
    document.querySelectorAll('[data-forget]').forEach((b) => { b.onclick = () => { forget(b.dataset.forget); createPage(); }; });
    const f = document.getElementById('nf');
    f.onsubmit = async (e) => {
      e.preventDefault();
      f.querySelector('button').disabled = true;
      try {
        const r = await fetch('/p/api/new', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: f.elements.name.value }) });
        const out = await r.json();
        if (!r.ok) throw new Error(out.error || 'Erreur');
        if (out.admin) store.set(`pronos.admin.${out.id}`, out.admin);
        location.href = `/p/${out.id}?new=1`;
      } catch (err) { const m = document.getElementById('msg'); m.className = 'msg bad'; m.textContent = err.message; f.querySelector('button').disabled = false; }
    };
  }
  // Lien du groupe à envoyer (partage du téléphone, sinon copie)
  function invite() {
    const url = `${location.origin}/p/${id}`;
    // Partage du système sur téléphone ; sur ordinateur, simple copie du lien
    const share = navigator.share && matchMedia('(pointer: coarse)').matches;
    const box = document.createElement('section');
    box.className = 'box';
    box.innerHTML = `<h2>Inviter des amis</h2><p class="dim msg">Ils jouent depuis cette page, sans rien installer.</p>
      <div class="picks"><input readonly value="${esc(url)}"><button type="button" id="share">${share ? 'Partager le lien' : 'Copier le lien'}</button></div>`;
    document.querySelector('main').insertBefore(box, document.querySelector('footer'));
    myLink();
    box.querySelector('#share').onclick = async () => {
      try { if (share) await navigator.share({ title: document.title, url }); else { await navigator.clipboard.writeText(url); box.querySelector('#share').textContent = 'Lien copié'; } } catch { /* partage annulé */ }
    };
  }
  // Lien personnel : après le premier pronostic (jeton du pseudo)
  function myLink() {
    const tok = store.get(KEY);
    if (!tok || document.getElementById('me')) return;
    const link = `${location.origin}/p/${id}#k=${tok}`;
    const me = document.createElement('section');
    me.className = 'box';
    me.id = 'me';
    me.innerHTML = `<h2>Votre lien personnel</h2><p class="dim msg">Pour jouer sur un autre appareil. Gardez-le pour vous.</p>
      <div class="picks"><input readonly value="${esc(link)}"><button type="button">Copier mon lien</button></div>`;
    document.querySelector('main').insertBefore(me, document.querySelector('footer'));
    const b = me.querySelector('button');
    b.onclick = async () => { try { await navigator.clipboard.writeText(link); b.textContent = 'Lien copié'; } catch { me.querySelector('input').select(); } };
  }
  // Groupe à retirer de ce navigateur, ou à supprimer pour tout le monde (créateur du groupe)
  function removeBox() {
    const admin = store.get(`pronos.admin.${id}`);
    const box = document.createElement('section');
    box.className = 'box';
    box.innerHTML = `<h2>Retirer ou supprimer le groupe</h2><p class="dim msg">Retirer : de ce navigateur seulement.${admin || store.get(KEY) ? ' Supprimer : pour tout le monde.' : ''}</p>
      <div class="picks"><button type="button" class="ghost" id="forget">Retirer de mes groupes</button>${admin || store.get(KEY) ? '<button type="button" class="ghost" id="del">Supprimer le groupe</button>' : ''}</div><p class="msg" id="delMsg"></p>`;
    document.querySelector('main').insertBefore(box, document.querySelector('footer'));
    box.querySelector('#forget').onclick = () => {
      if (!confirm('Retirer ce groupe de vos groupes ? Il reste en ligne pour les autres joueurs.')) return;
      forget(id);
      location.href = '/p/';
    };
    const del = box.querySelector('#del');
    if (del) del.onclick = async () => {
      if (!confirm('Supprimer ce groupe pour tout le monde ? Les pronostics de tous les joueurs seront effacés.')) return;
      del.disabled = true;
      try {
        const r = await fetch(`/p/api/${id}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ admin: admin || undefined, tok: store.get(KEY) || undefined }) });
        const out = await r.json();
        if (!r.ok) throw new Error(out.error || 'Erreur');
        forget(id);
        location.href = '/p/';
      } catch (err) { const m = box.querySelector('#delMsg'); m.className = 'msg bad'; m.textContent = err.message; del.disabled = false; }
    };
  }
  if (!id) createPage();
  else {
    load().then(() => { if (view?.group) { invite(); removeBox(); } }).catch(() => { document.getElementById('root').innerHTML = '<p class="msg bad">Serveur injoignable : réessayez dans un instant.</p>'; });
    // Pronostics des autres relus toutes les 5 s, et au retour sur la page
    setInterval(() => { if (!document.hidden) load(true).catch(() => {}); }, 5000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true).catch(() => {}); });
  }
</script>
</body>
</html>
