name: Récupération des secrets

# Outil ponctuel : ré-exporte les secrets GitHub Actions de ce dépôt, chiffrés avec une phrase
# secrète que tu choisis, affichés en base64 dans les logs (le quota d'artifacts GitHub est plein).
# Le texte affiché est CHIFFRÉ : illisible sans la phrase secrète ; les valeurs n'apparaissent
# jamais en clair. À lancer à la main (Actions → « Récupération des secrets » → Run workflow),
# puis à supprimer une fois les secrets récupérés.
on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: "Phrase secrète pour chiffrer l'archive (choisis-la, note-la ailleurs)"
        required: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Chiffrer et afficher les secrets
        env:
          PASSPHRASE: ${{ github.event.inputs.passphrase }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          echo "::add-mask::$PASSPHRASE"
          jq -n \
            --arg CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID" \
            --arg CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN" \
            --arg EVS_ACCOUNT_NAME "$EVS_ACCOUNT_NAME" \
            --arg EVS_PASSWD "$EVS_PASSWD" \
            --arg SOURCE_TOKEN "$SOURCE_TOKEN" \
            --arg WINGET_TOKEN "$WINGET_TOKEN" \
            '$ARGS.named' > secrets.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt \
            -in secrets.json -out secrets.json.enc -pass env:PASSPHRASE
          rm -f secrets.json
          echo "----- DEBUT ARCHIVE CHIFFREE (base64) -----"
          base64 -w0 secrets.json.enc
          echo ""
          echo "----- FIN ARCHIVE CHIFFREE -----"
