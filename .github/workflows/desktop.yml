name: Application de bureau

# Génère l'application pour Windows (installateur + portable), macOS (Apple Silicon et Intel :
# .dmg + .zip pour les mises à jour) et Linux (AppImage x86_64 / ARM + paquet .deb) :
# - à la demande (onglet Actions → « Application de bureau » → Run workflow) ;
#   en renseignant « Version à publier » (ex. v1.1.0), le tag et la Release GitHub sont créés ;
# - ou en poussant un tag v* (ex. v1.1.0), qui crée aussi une Release GitHub.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version à publier (ex. v1.1.0) — laisser vide pour un simple test'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  # Une version publiée doit avoir ses nouveautés dans CHANGELOG.md : vérifié avant de compiler
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nouveautés de la version dans CHANGELOG.md
        if: env.RELEASE_TAG != ''
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > /dev/null

  build:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            script: dist
            files: |
              desktop/dist/*.exe
          - os: macos-latest
            name: macOS
            script: dist:mac
            files: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
          - os: ubuntu-latest
            name: Linux
            script: dist:linux
            files: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Signature VMP castlabs (Widevine) sous Windows et macOS : faite si les secrets
      # EVS_ACCOUNT_NAME / EVS_PASSWD existent (Linux : pas de VMP).
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - if: runner.os != 'Linux'
        run: python -m pip install --upgrade castlabs-evs
      - name: Numéro de version de l'appli = tag publié
        if: startsWith(env.RELEASE_TAG, 'v')
        shell: bash
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Paddock-Live-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(inputs.release_tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nouveautés de la version (CHANGELOG.md) + instructions d'installation ; échoue si la
      # version n'a pas sa section dans le journal des modifications
      - name: Notes de version
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md && cat release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Paddock Live ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          body_path: release-notes.md
      # Copie sur Cloudflare (R2) : téléchargements et mises à jour bien plus rapides en Europe (/dl/… du
      # serveur). Version retirée pendant la copie : le serveur renvoie vers GitHub tant qu'elle n'est pas
      # finie (ou si elle échoue, sans bloquer la publication sur GitHub)
      - name: Copie des fichiers sur Cloudflare
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::warning::Pas de jeton Cloudflare : fichiers sur GitHub seulement"; exit 0; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          W="npx --yes wrangler@4 r2 object"
          v="${RELEASE_TAG#v}"
          $W delete paddock-live-media/releases/version --remote || true
          for f in dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb; do
            n=$(basename "$f")
            $W put "paddock-live-media/releases/${n#Paddock-Live-$v-}" --file "$f" --remote
          done
          printf '%s' "$v" > version.txt
          $W put paddock-live-media/releases/version --file version.txt --remote
