name: Statistiques

# Déploie le petit serveur des statistiques d'utilisation anonymes (Cloudflare Worker + base D1,
# dossier analytics/) : automatiquement quand il est modifié, ou à la main (onglet Actions →
# « Statistiques » → Run workflow).
# Au premier lancement, la base D1 et sa table sont créées sur le compte du jeton.
# Secrets du dépôt :
# - CLOUDFLARE_API_TOKEN : jeton Cloudflare (modèle « Edit Cloudflare Workers » + permission
#   Compte → D1 → Modifier ; R2 activé sur le compte pour les vidéos) ;
# - STATS_KEY : mot de passe de la page des statistiques (/stats?key=…) ;
# - CLOUDFLARE_ACCOUNT_ID (facultatif) : seulement si le jeton donne accès à plusieurs comptes ;
# - ANTHROPIC_API_KEY (facultatif) : clé de l'API de Claude (organisation Console liée à l'abonnement Max) pour les
#   traductions ; sans elle, Mistral (Workers AI) comme avant.
on:
  workflow_dispatch:
  push:
    paths:
      - 'analytics/**'
      - 'shared/**'
      # Version web du direct (/live/) : l'interface de l'appli, copiée par scripts/build-studio.mjs
      - 'public/**'
      - 'scripts/build-studio.mjs'
      - 'docs/obs/*.json'
      - 'scripts/seance-en-cours.mjs'
      - '.github/workflows/stats.yml'

concurrency: stats-deploy

permissions:
  contents: read

jobs:
  # Un seul Studio, en production : on ne déploie que depuis une branche qui contient tout develop,
  # sinon une branche en retard (correction faite depuis main…) remettrait une ancienne version.
  a-jour:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        run: |
          if ! git merge-base --is-ancestor origin/develop HEAD; then echo "::notice::Studio non déployé : cette branche n'a pas toutes les modifications de develop"
          # Séance en cours suivie sur la version web : un déploiement couperait tous ses spectateurs. Remis à
          # plus tard (lancement à la main : onglet Actions → « Statistiques » → Run workflow). Le calendrier
          # d'abord : /live/api/session n'a pas répondu depuis les machines de GitHub pendant l'EL2 de Mexico
          elif [ "${{ github.event_name }}" = push ] && seance=$(node scripts/seance-en-cours.mjs); then
            echo "::notice::Séance en cours ($seance) : déploiement remis, à relancer à la main après la séance"
          elif [ "${{ github.event_name }}" = push ] && { live=$(curl -s --max-time 10 -w '\nHTTP %{http_code}' https://app.paddocklive.app/live/api/session); echo "$live" | tail -n 1; echo "$live" | grep -q '"status":"Started".*"live":true'; }; then
            echo "::notice::Séance en cours sur la version web : déploiement remis, à relancer à la main après la séance"
          else echo ok=1 >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: a-jour
    if: needs.a-jour.outputs.ok == '1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secrets présents
        env:
          STATS_KEY: ${{ secrets.STATS_KEY }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN manquant"; exit 1; }
          [ -n "$STATS_KEY" ] || { echo "::error::Secret STATS_KEY manquant"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
      - name: Dépendances du Worker (unpdf, lecture des PDF de la FIA)
        working-directory: .
        run: npm ci --omit=dev --ignore-scripts
      - name: Fichiers statiques (page web du créateur, code partagé, polices)
        run: node ../scripts/build-studio.mjs
      - name: Base D1 (créée si besoin)
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          id=$($WRANGLER d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const db=l.find(x=>x.name==='paddock-live-stats');console.log(db?db.uuid:'')})")
          if [ -z "$id" ]; then
            $WRANGLER d1 create paddock-live-stats --location weur
            id=$($WRANGLER d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);console.log(l.find(x=>x.name==='paddock-live-stats').uuid)})")
          fi
          echo "Base : $id"
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          $WRANGLER d1 execute paddock-live-stats --remote --file schema.sql
      - name: Stockage R2 des vidéos (créé si besoin)
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          if ! $WRANGLER r2 bucket info paddock-live-media >/dev/null 2>&1 && ! $WRANGLER r2 bucket create paddock-live-media; then
            # R2 non activé ou jeton sans la permission R2 : serveur déployé sans, vidéos publiées page ouverte impossibles
            echo "::warning::Stockage R2 indisponible (activez R2 et la permission Workers R2 Storage du jeton) : déploiement sans les vidéos confiées au serveur"
            sed -i '/^\[\[r2_buckets\]\]/,/^bucket_name/d' wrangler.toml
          fi
      - name: Déploiement
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          $WRANGLER deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Serveur des statistiques : $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Page : $url/stats?key=…" >> "$GITHUB_STEP_SUMMARY"
      - name: Mot de passe de la page
        env:
          STATS_KEY: ${{ secrets.STATS_KEY }}
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          printf '%s' "$STATS_KEY" | $WRANGLER secret put STATS_KEY
      - name: Clé de l'API de Claude (traductions)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | $WRANGLER secret put ANTHROPIC_API_KEY
          else echo "::notice::Secret ANTHROPIC_API_KEY absent : traductions par Mistral (Workers AI)"; fi
