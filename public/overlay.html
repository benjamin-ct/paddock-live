<!doctype html>
<html lang="fr" class="float-mini overlay">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paddock Live — overlay</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/broadcast.css">
  <script>/* Overlay de streaming (OBS…) : thème sombre, fond transparent */ document.documentElement.dataset.scheme = 'dark'; document.documentElement.dataset.theme = 'pitwall'; /* Opacité du fond (&bg=0 à 100, Réglages → Streaming) */ const bg = new URLSearchParams(location.search).get('bg'); if (bg !== null) document.documentElement.style.setProperty('--ov-bg', `${Math.min(100, Math.max(0, Number(bg) || 0))}%`);</script>
</head>
<body class="ov-body">
  <!-- Overlay de streaming : ?w=banner | laps | countdown | podium | telemetry (Réglages → Streaming) -->
  <div class="ov" id="ov"></div>
  <script type="module" src="/js/overlay.js"></script>
</body>
</html>
