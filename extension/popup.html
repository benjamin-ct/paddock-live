<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Styles dans la page : sous Windows, une feuille .css séparée peut être refusée (type de fichier
     modifié dans le registre par un autre logiciel) -->
<style>
:root { color-scheme: dark; --bg: #0b0c0f; --card: #15171c; --line: rgba(255, 255, 255, .1); --text: #f2f1ee; --muted: #9a9892; --red: #e10600; --ok: #2fbf71; }
[hidden] { display: none !important; }
body { width: 300px; margin: 0; padding: 14px; background: var(--bg); color: var(--text); font: 13.5px/1.45 system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 15px; letter-spacing: .03em; }
header img { width: 24px; height: 24px; border-radius: 6px; }
header span { color: var(--red); }
.row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.row small { color: var(--muted); }
.dot { flex: none; width: 9px; height: 9px; margin-top: 5px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--ok); }
.dot.off { background: var(--red); }
.btn { display: block; width: 100%; box-sizing: border-box; margin: 0 0 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); font: 600 13.5px system-ui, sans-serif; text-align: center; text-decoration: none; cursor: pointer; }
.btn.main { background: var(--red); border-color: var(--red); }
#msg { min-height: 1em; margin: 4px 0; }
#msg.ok { color: var(--ok); }
.note { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header><img src="icons/32.png" alt=""><b>PADDOCK <span>LIVE</span></b></header>
  <div class="row"><span class="dot" id="f1Dot"></span><div><small data-i18n="f1tv"></small><div id="f1Text"></div></div></div>
  <a class="btn" id="login" href="https://f1tv.formula1.com/" target="_blank" hidden data-i18n="f1tvLogin"></a>
  <div class="row"><span class="dot" id="appDot"></span><div><small data-i18n="app"></small><div id="appText"></div></div></div>
  <a class="btn" id="get" href="https://paddocklive.app/#telecharger" target="_blank" hidden data-i18n="download"></a>
  <button class="btn main" id="send" hidden data-i18n="send"></button>
  <p id="msg" role="status"></p>
  <p class="note" data-i18n="auto"></p>
  <p class="note" data-i18n="privacy"></p>
  <script src="popup.js"></script>
</body>
</html>
